
name: Build Photo Sorter EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify source file
        shell: pwsh
        run: |
          if (!(Test-Path "photo_sorter.py")) {
            throw "File photo_sorter.py tidak ditemukan di root repository."
          }
          if (!(Test-Path "requirements.txt")) {
            throw "File requirements.txt tidak ditemukan di root repository."
          }

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PhotoSorter photo_sorter.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-Windows
          path: dist/PhotoSorter.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PhotoSorter.exe

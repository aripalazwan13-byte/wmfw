
name: Build Photo Sorter EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build aplikasi EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PhotoSorter photo_sorter.py

      - name: Upload hasil EXE
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-Windows
          path: dist/PhotoSorter.exe
          if-no-files-found: error
          retention-days: 30

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PhotoSorter.exe
